spring.application.name=fx-catalog-service
server.port=8002
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
# Refresca la copia local del registro cada 5 s (por defecto 30 s) para descubrir antes a fx-course-service
eureka.client.registry-fetch-interval-seconds=5

# --- Resilience4j: Circuit Breaker "courseService" (usado con @CircuitBreaker en CatalogController) ---
resilience4j.circuitbreaker.instances.courseService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.courseService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.courseService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.courseService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.courseService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.courseService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.courseService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.courseService.eventConsumerBufferSize=10
# Un 4xx es un error del cliente, no una falla del servicio: no debe abrir el circuito
resilience4j.circuitbreaker.instances.courseService.ignoreExceptions[0]=org.springframework.web.client.HttpClientErrorException

# --- Resilience4j: Retry "courseService" (usado con @Retry en CatalogController) ---
resilience4j.retry.instances.courseService.maxAttempts=3
resilience4j.retry.instances.courseService.waitDuration=500ms
resilience4j.retry.instances.courseService.ignoreExceptions[0]=org.springframework.web.client.HttpClientErrorException

# Orden de los aspectos: CircuitBreaker( Retry( llamada ) ).
# Asi el Circuit Breaker ve una sola falla por peticion (tras agotar los reintentos)
# y, con el circuito abierto, no se reintenta nada.
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

# --- Monitoreo con Actuator ---
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
