spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.application.name=fx-course-service
server.port=8001
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# --- OpenTelemetry (Java agent) ---
# El agente no lee application.properties por sí solo: se le pasa este archivo con
# -Dotel.javaagent.configuration-file (ver README). Las variables de entorno OTEL_* tienen prioridad.
otel.exporter.otlp.endpoint=http://localhost:4317
otel.exporter.otlp.protocol=grpc
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.exporter=otlp
