spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.application.name=fx-course-service
server.port=8001
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# --- OpenTelemetry: exportacion al OpenTelemetry Collector ---
# localhost:4319 es el puerto gRPC del Collector publicado por docker-compose (4317 es Jaeger directo).
# En Docker Compose lo reemplaza OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317.
otel.exporter.otlp.endpoint=http://localhost:4319
otel.exporter.otlp.protocol=grpc
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# --- Micrometer: exportacion de metricas por OTLP/HTTP al Collector (micrometer-registry-otlp) ---
# localhost:4320 es el puerto HTTP del Collector publicado por docker-compose.
# En Docker Compose lo reemplaza MANAGEMENT_OTLP_METRICS_EXPORT_URL=http://otel-collector:4318/v1/metrics.
# service.name (= spring.application.name) va como atributo de recurso: en Prometheus queda en exported_job.
management.otlp.metrics.export.url=http://localhost:4320/v1/metrics
management.otlp.metrics.export.step=10s
# Tiempos en segundos (por defecto milisegundos): en Prometheus las metricas se llaman *_seconds_*
management.otlp.metrics.export.base-time-unit=seconds
# Buckets de histograma para poder calcular percentiles en Prometheus/Grafana con histogram_quantile
management.metrics.distribution.percentiles-histogram.http.server.requests=true
