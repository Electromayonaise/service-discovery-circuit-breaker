spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.application.name=fx-course-service
server.port=8001
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# --- OpenTelemetry: exportacion al OpenTelemetry Collector ---
# localhost:4319 es el puerto gRPC del Collector publicado por docker-compose (4317 es Jaeger directo).
# En Docker Compose lo reemplaza OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317.
otel.exporter.otlp.endpoint=http://localhost:4319
otel.exporter.otlp.protocol=grpc
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
