# Levanta los tres servicios del taller y Jaeger:  docker compose up --build
# Los puertos publicados son los mismos que al ejecutarlos localmente (8761, 8001, 8002).
# Taller 2, parte 1: fx-course-service y fx-catalog-service corren con el agente Java de
# OpenTelemetry y envian las trazas a Jaeger (UI en http://localhost:16686).
name: fx-microservices

services:
  fx-discovery-server:
    build: ./fx-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8761"]
      interval: 5s
      timeout: 3s
      retries: 30

  fx-course-service:
    build: ./fx-course-service
    ports:
      - "8001:8001"
    environment:
      EUREKA_URL: http://fx-discovery-server:8761/eureka/
      # Nombre con el que se registra en Eureka: es el que usara el catalogo para llamarlo
      # (homePageUrl = http://fx-course-service:8001/), resoluble dentro de la red de Compose
      EUREKA_INSTANCE_HOSTNAME: fx-course-service
      # Dentro de la red de Compose Jaeger no esta en localhost (sobrescribe otel.properties)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      fx-discovery-server:
        condition: service_healthy
      jaeger:
        condition: service_started

  fx-catalog-service:
    build: ./fx-catalog-service
    ports:
      - "8002:8002"
    environment:
      EUREKA_URL: http://fx-discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: fx-catalog-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      fx-discovery-server:
        condition: service_healthy
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Web UI
      - "14250:14250"   # gRPC for Jaeger-to-Jaeger communication
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
