# Levanta los tres servicios del taller, el Collector y Jaeger:  docker compose up --build
# Los puertos publicados son los mismos que al ejecutarlos localmente (8761, 8001, 8002).
# Taller 2, parte 3: fx-course-service y fx-catalog-service usan la API/SDK de OpenTelemetry
# (OpenTelemetryConfig) y envian las trazas al OpenTelemetry Collector, que las reenvia a Jaeger
# (UI en http://localhost:16686).
name: fx-microservices

services:
  fx-discovery-server:
    build: ./fx-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8761"]
      interval: 5s
      timeout: 3s
      retries: 30

  fx-course-service:
    build: ./fx-course-service
    ports:
      - "8001:8001"
    environment:
      EUREKA_URL: http://fx-discovery-server:8761/eureka/
      # Nombre con el que se registra en Eureka: es el que usara el catalogo para llamarlo
      # (homePageUrl = http://fx-course-service:8001/), resoluble dentro de la red de Compose
      EUREKA_INSTANCE_HOSTNAME: fx-course-service
      # Exportador OTLP de OpenTelemetryConfig: dentro de la red de Compose el Collector no esta en localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      fx-discovery-server:
        condition: service_healthy
      otel-collector:
        condition: service_started

  fx-catalog-service:
    build: ./fx-catalog-service
    ports:
      - "8002:8002"
    environment:
      EUREKA_URL: http://fx-discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: fx-catalog-service
      # Exportador OTLP de OpenTelemetryConfig: dentro de la red de Compose el Collector no esta en localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      fx-discovery-server:
        condition: service_healthy
      otel-collector:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Web UI
      - "14250:14250"   # gRPC for Jaeger-to-Jaeger communication
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  otel-collector:
    image: otel/opentelemetry-collector:0.88.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4319:4317"     # OTLP gRPC receiver
      - "4320:4318"     # OTLP HTTP receiver
    depends_on:
      - jaeger
