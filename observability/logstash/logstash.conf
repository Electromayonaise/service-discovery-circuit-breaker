# Pipeline de Logstash: lee el archivo que escribe el exportador "file" del OpenTelemetry Collector y envia los
# logs a Elasticsearch (indice otel-logs-AAAA.MM.DD).
#
# Cada linea del archivo es un lote OTLP en JSON (resourceLogs -> scopeLogs -> logRecords), con varios logs y de
# varios servicios. El filtro json de la guia dejaria un documento por lote con los logs anidados en arreglos,
# que no se pueden consultar por servicio o nivel. Por eso el filtro ruby (otlp_logs.rb) separa el lote en un
# evento por log y copia los datos a campos planos (con nombres de ECS, los que usa la consulta del taller):
#   @timestamp, message, log.level, log.logger, service.name, trace.id, span.id,
#   attributes.* (atributos del log: thread.name, exception.type, ...) y resource.* (atributos del recurso).
input {
  file {
    path => "/var/log/otel-collector.log"
    start_position => "beginning"
  }
}

filter {
  json {
    source => "message"
    target => "otlp"
  }

  ruby {
    path => "/usr/share/logstash/scripts/otlp_logs.rb"
  }
}

# La plantilla otel-logs-template.json (la instala Logstash al arrancar) define los campos de texto como keyword,
# para poder filtrarlos y agregarlos en Kibana, y deja el indice sin replicas (Elasticsearch es un solo nodo).
output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "otel-logs-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      template => "/usr/share/logstash/templates/otel-logs-template.json"
      template_name => "otel-logs"
      template_overwrite => true
    }
  } else {
    # Lineas que no son un lote OTLP (no deberian aparecer): se guardan tal cual para poder revisarlas
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "otel-logs-%{+YYYY.MM.dd}"
    }
  }
}
