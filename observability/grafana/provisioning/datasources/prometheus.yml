# Registra Prometheus como fuente de datos de Grafana al arrancar (equivale al paso
# "Configurar Prometheus como fuente de datos" de la guia, sin tener que hacerlo a mano).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
