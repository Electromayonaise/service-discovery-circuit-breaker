# Prometheus scrapea el exportador "prometheus" del OpenTelemetry Collector (otel-collector:8889), donde quedan
# todas las metricas que los servicios envian por OTLP. Cada serie trae la etiqueta exported_job con el
# service.name del servicio que la produjo (fx-catalog-service o fx-course-service).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8889']
